<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCS — sideways</title>
<link rel="stylesheet" href="css/style.css">
<!-- The side-scroller: same game files, plus js/horizontal.js which turns the tower sideways -->
<script>window.RCS_LAYOUT = 'horizontal';</script>
</head>
<body>
<canvas id="c"></canvas>
<!-- Name boxes for player 1 and player 2, shown on the setup screen (placed by js/name.js) -->
<input id="name1" class="name-box" maxlength="12" placeholder="Name" autocomplete="off" spellcheck="false" aria-label="Player 1 name">
<input id="name2" class="name-box" maxlength="12" placeholder="Name" autocomplete="off" spellcheck="false" aria-label="Player 2 name">
<!-- Plain scripts (not modules) so the game also runs when index.html is opened straight from disk. Order matters. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/canvas.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/net.js"></script>
<script src="js/level.js"></script>
<script src="js/effects.js"></script>
<script src="js/menu.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/name.js"></script>
<script src="js/horizontal.js"></script>
<script src="js/main.js"></script>
</body>
</html>
