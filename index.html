<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCS</title>
<link rel="stylesheet" href="css/style.css?v=140">
</head>
<body>
<canvas id="c"></canvas>
<!-- Chat box for the online room (js/chat.js) -->
<!-- Private room password box (js/private.js) -->
<div id="priv" class="priv-box" role="dialog" aria-label="Private room">
  <div class="priv-title">PRIVATE ROOM</div>
  <div class="priv-sub">Same password, same room — share it with your friends</div>
  <input id="privcode" class="priv-input" maxlength="24" placeholder="Room password" autocomplete="off" spellcheck="false" aria-label="Room password">
  <div class="priv-hint">Enter to join · Esc to cancel</div>
</div>
<input id="chat" class="chat-box" maxlength="80" placeholder="Say something… (Enter to send, Esc to cancel)" autocomplete="off" spellcheck="false" aria-label="Chat message">
<!-- ?v=140: bump this number on every update so browsers load the new files instead of old saved copies. -->
<!-- Plain scripts (not modules) so the game also runs when index.html is opened straight from disk. Order matters. -->
